    <!-- The home page ships prerendered (for crawlers), but visitors who get the intro
         should see the intro first, not the page and then the intro over it. This covers
         the prerendered content only for them, until the intro mounts and lifts it. -->
    <script>
      (function () {
        try {
          if (!navigator.webdriver && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.documentElement.classList.add('intro-pending');
            // safety net: if the app never loads, never leave a blank page
            window.__bootTimer = setTimeout(function () {
              document.documentElement.classList.remove('intro-pending');
            }, 4000);
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /*
       * The intro, in plain HTML and CSS so it is on screen before any script loads (first
       * paint no longer waits for the JavaScript bundle). Shown only when the inline script
       * above sets .intro-pending; the app then drives the counter and lifts it.
       */
      #boot { display: none; }
      html.intro-pending #boot { display: block; position: fixed; inset: 0; z-index: 80; }
      html.intro-pending { overflow: hidden; }
      #boot .veil, #boot .panel { position: absolute; inset: 0; clip-path: inset(0 0 0 0); }
      #boot .veil { background: #7c4dff; }
      #boot .panel { display: grid; place-items: center; background: #08060e; }
      #boot .inner { display: flex; width: min(280px, 64vw); flex-direction: column; align-items: center; }
      #boot .logo { width: 64px; height: 64px; animation: boot-logo 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      #boot .meta { margin-top: 40px; width: 100%; animation: boot-meta 0.5s ease-out 0.2s both; }
      #boot .track { position: relative; display: block; height: 1px; overflow: hidden; background: rgba(244, 241, 250, 0.15); }
      #boot .bar { position: absolute; inset: 0; transform: scaleX(0); transform-origin: left; background: #a07cff; }
      #boot .row { margin-top: 12px; display: flex; justify-content: space-between; align-items: center;
        font: 400 10px/1.4 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.28em; text-transform: uppercase; color: #867e9c; }
      #boot .num { color: #f4f1fa; font-variant-numeric: tabular-nums; }
      @media (min-width: 640px) { #boot .logo { width: 80px; height: 80px; } }
      @keyframes boot-logo { from { opacity: 0; transform: scale(0.6) rotate(-120deg); } to { opacity: 1; transform: none; } }
      @keyframes boot-meta { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    </style>
