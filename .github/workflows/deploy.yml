name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The CV PDFs are rendered with headless Chrome, so CI needs one.
      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - run: npm run build

      # Regenerate the PDFs from the current data rather than trusting the copies
      # in the repo, which is how a committed CV drifts out of sync.
      - run: npm run cv

      # Tests gate the deploy. They assert the CV is one page and that a parser
      # can read the name, email and GitHub handle out of it.
      - run: npm test

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
